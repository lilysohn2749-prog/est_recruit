<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이스트소프트 AI 빌더 크루 | 신입 인턴 채용</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --blue:#0040f9; --blue-dark:#0030c0; --blue-soft:#e8edff;
    --black:#0b0e16; --black2:#121626;
    --ink:#191f28; --gray:#4e5968; --gray2:#8b95a1; --line:#e8eaef;
    --bg:#ffffff; --bg2:#f6f7fb;
    --radius:22px; --maxw:1080px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Pretendard",-apple-system,sans-serif;color:var(--ink);background:var(--bg);
    line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-0.02em;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--blue);color:#fff;font-weight:700;border:none;cursor:pointer;
    padding:16px 28px;border-radius:14px;font-size:17px;transition:.15s;white-space:nowrap}
  .btn:hover{background:var(--blue-dark);transform:translateY(-1px)}
  .btn.lg{padding:20px 36px;font-size:19px;border-radius:16px}
  .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3)}
  .btn.ghost:hover{background:rgba(255,255,255,.24)}
  .btn.white{background:#fff;color:var(--blue)}
  .btn.white:hover{background:#eef1ff}
  .btn.outline{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
  .btn.outline:hover{background:var(--blue-soft)}
  .logo-img{height:24px;width:auto}
  .logo-img.foot{height:22px;opacity:.92}
  nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  nav .brand{display:flex;align-items:center;gap:12px;color:var(--ink);font-weight:700;font-size:17px}
  nav .brand .div{width:1px;height:18px;background:var(--line)}
  nav .brand .ai{color:var(--blue);font-weight:800}
  nav .btn{padding:10px 20px;font-size:15px;border-radius:12px}
  .hero{position:relative;overflow:hidden;color:#fff;padding:108px 0 108px}
  .hero .hero-bg{position:absolute;inset:0;z-index:0}
  .hero .hero-bg img,.hero .hero-bg video{width:100%;height:100%;object-fit:cover}
  .hero .hero-bg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(11,14,22,.45) 0%,rgba(11,14,22,.72) 100%)}
  .hero .wrap{position:relative;z-index:1}
  .hero h1{font-size:52px;font-weight:800;line-height:1.2;letter-spacing:-0.04em;text-shadow:0 2px 20px rgba(0,0,0,.3)}
  .hero h1 .point{color:#9db4ff}
  .hero p.sub{margin-top:24px;font-size:19px;color:#dce3f0;font-weight:500;line-height:1.65;max-width:780px}
  .notice{margin-top:28px;display:flex;flex-direction:column;gap:10px;max-width:800px}
  .notice div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;
    padding:14px 18px;font-size:15.5px;color:#eef2fb;font-weight:600}
  .notice b{color:#fff}
  .hero .cta{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap}
  .chips{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px}
  .chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;
    padding:11px 18px;font-size:15px;font-weight:600;color:#cdd5e6}
  .chip b{color:#fff}
  section{padding:88px 0}
  .sec-head{margin-bottom:44px}
  .sec-head .tag{color:var(--blue);font-weight:800;font-size:22px;margin-bottom:14px;letter-spacing:-0.02em}
  .sec-head h2{font-size:40px;font-weight:800;line-height:1.2;letter-spacing:-0.035em}
  .sec-head p{margin-top:16px;font-size:18px;color:var(--gray);font-weight:500;line-height:1.65;max-width:820px}
  .sell{background:var(--bg2)}
  .why-list{display:flex;flex-direction:column;gap:12px;max-width:840px}
  details.why{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.15s}
  details.why[open]{border-color:#c7d3f0;box-shadow:0 8px 24px rgba(0,64,249,.08)}
  details.why summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:20px 22px}
  details.why summary::-webkit-details-marker{display:none}
  .why .wi{font-size:22px;width:28px;text-align:center;flex:none}
  .why .wt{font-size:18.5px;font-weight:800;letter-spacing:-0.025em;flex:1}
  .why .warw{font-size:20px;color:var(--gray2);transition:.2s;flex:none}
  details.why[open] .warw{transform:rotate(90deg);color:var(--blue)}
  .why .wb{padding:0 22px 22px 64px;font-size:16px;color:var(--gray);line-height:1.7}
  .why .wb b{color:var(--blue);font-weight:700}
  .jobs-tools{margin:-12px 0 30px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .jobs-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  details.job{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.18s}
  details.job[open]{border-color:var(--blue);box-shadow:0 14px 36px rgba(0,64,249,.12)}
  details.job summary{list-style:none;cursor:pointer;padding:30px 30px;display:block}
  details.job summary::-webkit-details-marker{display:none}
  .job .role{font-size:13px;font-weight:700;color:var(--blue);background:var(--blue-soft);
    display:inline-block;padding:5px 12px;border-radius:999px;margin-bottom:14px}
  .job .title{font-size:25px;font-weight:800;letter-spacing:-0.03em}
  .job .one{margin-top:10px;font-size:16px;color:var(--gray);font-weight:500;line-height:1.55}
  .job .more{margin-top:18px;font-size:14.5px;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:6px}
  .job .more .arw{transition:.2s;font-size:18px;line-height:1}
  details.job[open] summary .more .arw{transform:rotate(90deg)}
  .job .body{padding:0 30px 30px;border-top:1px solid var(--line);margin-top:6px}
  .job .body .block{margin-top:24px}
  .job .body .block h4{font-size:16.5px;font-weight:800;margin-bottom:12px;color:var(--ink)}
  .job .body ul{list-style:none;display:flex;flex-direction:column;gap:9px}
  .job .body li{position:relative;padding-left:22px;font-size:15.5px;color:var(--gray);line-height:1.58}
  .job .body li::before{content:"";position:absolute;left:4px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
  .job .body .apply{margin-top:28px}
  .job .body .apply .btn{width:100%}
  .job .body .apply small{display:block;margin-top:10px;color:var(--gray2);font-size:13px;text-align:center}
  .flow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;max-width:780px;margin:0 auto}
  .flow .step{flex:1;text-align:center;position:relative}
  .flow .step:not(:first-child)::before{content:"";position:absolute;top:34px;left:-50%;width:100%;height:3px;background:var(--blue-soft);z-index:0}
  .flow .dot{position:relative;z-index:1;width:68px;height:68px;border-radius:50%;background:#fff;color:var(--blue);
    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;margin:0 auto 18px;border:3px solid var(--blue)}
  .flow .step h4{font-size:17px;font-weight:800;letter-spacing:-0.02em}
  .flow .step p{font-size:14px;color:var(--gray);margin-top:6px;line-height:1.5}
  .flow-note{margin-top:34px;text-align:center;font-size:15.5px;color:var(--blue-dark);font-weight:700;
    background:var(--blue-soft);border-radius:12px;padding:16px 20px;max-width:780px;margin-left:auto;margin-right:auto}
  .ev{background:var(--bg2)}
  .ev-emph{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
  .ev-emph div{background:#fff;border:1px solid #cfe0ff;border-left:4px solid var(--blue);border-radius:12px;
    padding:16px 20px;font-size:16px;font-weight:700;color:var(--ink);line-height:1.55}
  .ev-emph div b{color:var(--blue)}
  .ev .info{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
  .ev .info .chip2{background:#fff;border:1px solid var(--line);border-radius:999px;padding:11px 18px;font-size:15px;font-weight:600;color:var(--gray)}
  .ev .info .chip2 b{color:var(--ink)}
  .sess-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .sess{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px}
  .sess .sn{display:inline-block;font-size:13px;font-weight:800;color:var(--blue);background:var(--blue-soft);padding:5px 12px;border-radius:999px;margin-bottom:14px}
  .sess h4{font-size:20px;font-weight:800;letter-spacing:-0.02em;margin-bottom:16px}
  .sess ul{list-style:none;display:flex;flex-direction:column;gap:11px}
  .sess li{position:relative;padding-left:20px;font-size:15.5px;color:var(--gray);line-height:1.55}
  .sess li::before{content:"";position:absolute;left:3px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
  .sess li b{color:var(--ink);font-weight:700}
  .gift{margin-top:22px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
  .gift img{width:340px;max-width:100%;border-radius:14px;flex:none;border:1px solid var(--line)}
  .gift .g-txt{flex:1;min-width:240px}
  .gift .g-txt h4{font-size:21px;font-weight:800;letter-spacing:-0.02em}
  .gift .g-txt p{margin-top:10px;color:var(--gray);font-size:16px;line-height:1.65}
  .map-embed{margin-top:26px;border-radius:16px;overflow:hidden;border:1px solid var(--line);height:360px}
  .map-embed iframe{width:100%;height:100%;border:0;display:block}
  .event-cta{margin-top:34px;text-align:center}
  .ctaf{background:radial-gradient(700px 400px at 50% -20%, rgba(0,64,249,.5) 0%, rgba(0,64,249,0) 60%),var(--black);color:#fff;text-align:center}
  .ctaf h2{font-size:42px;font-weight:800;line-height:1.25;letter-spacing:-0.035em}
  .ctaf p{margin-top:18px;font-size:19px;color:#b9c2d4}
  .ctaf .cta{margin-top:34px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .ctaf .info{margin-top:40px;font-size:15px;color:#8b95a8;line-height:1.9}
  footer{background:var(--black2);color:#7e879b;font-size:14px;padding:40px 0}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;align-items:center}
  footer .brand-f{display:flex;align-items:center;gap:12px}
  .mcta{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:12px 16px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:none}
  .mcta .btn{width:100%}
  @media(max-width:1024px){
    .hero h1{font-size:44px}
    .sec-head h2{font-size:34px}
    .wrap{padding:0 20px}
  }
  @media(max-width:768px){
    .hero{padding:60px 0 52px}
    .hero h1{font-size:29px;line-height:1.26}
    .hero p.sub{font-size:16px;margin-top:18px}
    .notice{margin-top:22px;gap:8px}
    .notice div{font-size:14px;padding:12px 14px}
    .hero .cta{margin-top:26px;flex-direction:column;align-items:stretch}
    .hero .cta .btn{width:100%}
    .chips{margin-top:22px}
    .chip{font-size:13.5px;padding:9px 14px}
    section{padding:52px 0}
    .sec-head{margin-bottom:30px}
    .sec-head .tag{font-size:16px}
    .sec-head h2{font-size:24px}
    .sec-head p{font-size:15.5px}
    .why .wt{font-size:16.5px}
    .why .wb{padding:0 20px 20px 22px;font-size:15px}
    .jobs-grid,.sess-grid{grid-template-columns:1fr}
    details.job summary{padding:22px}
    .job .title{font-size:22px}
    .job .body{padding:0 22px 22px}
    .flow{flex-direction:column;gap:22px;max-width:320px}
    .flow .step:not(:first-child)::before{display:none}
    .flow-note{font-size:14.5px}
    .gift{flex-direction:column;align-items:flex-start;padding:18px}
    .gift img{width:100%}
    .map-embed{height:280px}
    .ctaf h2{font-size:25px}
    .ctaf .cta{flex-direction:column;align-items:stretch}
    .ctaf .cta .btn{width:100%}
    footer .wrap{flex-direction:column;align-items:flex-start;gap:10px}
    .mcta{display:block}
    body{padding-bottom:78px}
    nav .btn{display:none}
  }

  /* ===== motion ===== */
  @keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  @keyframes sheen{0%{background-position:-200% center}100%{background-position:200% center}}
  @keyframes glowmove{0%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,3%) scale(1.1)}100%{transform:translate(0,0) scale(1)}}
  .reveal{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}
  .hero .wrap>*{opacity:0;animation:fadeUp .85s cubic-bezier(.2,.7,.2,1) forwards}
  .hero h1{animation-delay:.05s}
  .hero p.sub{animation-delay:.22s}
  .hero .notice{animation-delay:.32s}
  .hero .cta{animation-delay:.46s}
  .hero h1 .point{background:linear-gradient(90deg,#9db4ff,#6f8cff,#cbd8ff,#9db4ff);background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:sheen 4.5s linear infinite}
  .hero .glow{position:absolute;inset:-12%;z-index:0;pointer-events:none;
    background:radial-gradient(440px 340px at 75% 22%, rgba(80,120,240,.4), transparent 62%),
               radial-gradient(400px 320px at 18% 82%, rgba(0,64,249,.32), transparent 62%);
    animation:glowmove 13s ease-in-out infinite}
  .btn{position:relative}
  .btn:hover{box-shadow:0 12px 28px rgba(0,64,249,.38)}
  .btn.white:hover{box-shadow:0 12px 28px rgba(255,255,255,.28)}
  details.why{transition:transform .18s,border-color .18s,box-shadow .18s}
  details.why:hover{transform:translateY(-3px);border-color:#b9c8f0;box-shadow:0 12px 30px rgba(0,64,249,.1)}
  details.job:hover{transform:translateY(-4px);border-color:var(--blue);box-shadow:0 16px 38px rgba(0,64,249,.16)}
  .job .role{transition:.15s}
  details.job:hover .role{background:var(--blue);color:#fff}
  .sess{transition:transform .18s,border-color .18s,box-shadow .18s}
  .sess:hover{transform:translateY(-4px);border-color:#b9c8f0;box-shadow:0 14px 32px rgba(0,64,249,.12)}
  .ev .info .chip2{transition:.15s}
  .ev .info .chip2:hover{border-color:var(--blue);color:var(--blue)}
  .flow .dot{transition:transform .25s,box-shadow .25s}
  .flow .step:hover .dot{transform:scale(1.1);box-shadow:0 8px 22px rgba(0,64,249,.32)}
  .gift{transition:box-shadow .18s,transform .18s}
  .gift:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(0,64,249,.1)}
  @media(max-width:768px){
    .hero-char{display:block;position:static;right:auto;bottom:auto;width:190px;margin:24px auto 0}
    .proc-char,.ev-char{display:block;position:static;right:auto;top:auto;width:140px;margin:8px auto 22px}
    .cta-char{width:128px}
    .hero h1{font-size:28px}
    .hero p.sub{font-size:15.5px}
  }
</style>
</head>
